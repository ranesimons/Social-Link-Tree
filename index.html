            color: #fff;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            text-decoration: none;
            transition: background 0.2s, transform 0.2s;
        }

        .links a:hover,
        .links a:focus-visible {
            background: rgba(55, 45, 38, 0.95);
            transform: translateY(-2px);
        }

        .links svg {
            position: absolute;
            left: 24px;
            top: 50%;
            transform: translateY(-50%);
            width: 34px;
            height: 30px;
            fill: currentColor;
        }

        .copyright {
            margin: 50px 0 0;
            font-size: 12px;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        @media (max-width: 767px) {
            h1 { font-size: 28px; }

                padding: 0 52px;
                font-size: 15px;
